[project]
name = "vocab-agent"
version = "0.1.0"
description = "把用户摘录的生词导入词库，并按记忆曲线安排背诵"
requires-python = ">=3.11"

# 运行时依赖。每一条都写清楚为什么需要它：
#   fastapi / uvicorn  -> 后端接口与本地服务
#   pdfplumber         -> 读取 PDF 里每个词的坐标（坐标分列解析的根基）
#   httpx              -> 调 DeepSeek 接口、调在线词典接口
#   pydantic           -> EntryDraft 入库契约，保证脏数据进不了库
#   pydantic-settings  -> 读取 .env 配置
#   langgraph          -> 导入流程的编排（状态图）
#   python-dotenv      -> .env 解析（pydantic-settings 的底层依赖）
dependencies = [
    "fastapi",
    "uvicorn",
    "pdfplumber",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "langgraph",
]

[dependency-groups]
# 开发期依赖：只跑测试和生成测试样例用，不进运行时
#   pytest    -> 跑单元测试
#   reportlab -> 生成"版式复刻"的样例 PDF（见 tests/fixtures/make_fixture.py）
dev = ["pytest", "reportlab"]

[project.scripts]
# 装好之后可以直接用 vocab 命令，不用记 python -m 的长路径
#   vocab import 某个文件.pdf
#   vocab today
#   vocab stats
vocab = "vocab_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 源码放在 src/ 下，避免测试时误 import 到本地目录
where = ["src"]

[tool.pytest.ini_options]
# 不装包也能跑测试：把 src 加进 import 路径
pythonpath = ["src"]
testpaths = ["tests"]
